# Included in every location of nginx.conf.template. nginx drops a parent's add_header lines the
# moment a location declares one of its own (the cache headers on /assets/ and /index.html do), so
# the headers are not written once at server level — they are included where each answer is made.
# `always` puts them on 4xx and 5xx answers as well; a refusal is still a page in this origin.
#
# The policy text itself is the $csp variable set in nginx.conf.template, next to the reasoning.
add_header Content-Security-Policy $csp always;
# Serve every file as the type it was written with. Without this, a browser may read a JSON or text
# answer as a script if the URL or the bytes look like one.
add_header X-Content-Type-Options "nosniff" always;
# The same fact as `frame-ancestors 'none'`, for browsers that read only this older header.
add_header X-Frame-Options "DENY" always;
# Addresses here carry party and contract ids. A link out of this page must not hand them to the
# destination. index.html says the same in a <meta> tag; the header says it before the page is read.
add_header Referrer-Policy "no-referrer" always;
# Nothing on these screens uses the camera, microphone or location.
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
